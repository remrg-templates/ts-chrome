<!doctype html>
<html>
	<head>
		<meta charset="UTF-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'"
		/>
		<meta
			http-equiv="X-Content-Security-Policy"
			content="default-src 'self'; script-src 'self'"
		/>
		<title>{{ remrg:var project-name }} Extension</title>
		<link
			href="index.scss"
			rel="stylesheet"
			type="text/css"
		/>
	</head>
	<body>
		<div class="popup-container">
			<h1>{{ remrg:var project-name }}</h1>
			<p>Welcome to the {{ remrg:var project-name }} Chrome Extension!</p>
			<button id="action-btn">Perform Action</button>
			<div id="status"></div>
		</div>
		<script
			type="module"
			src="index.ts"
		></script>
	</body>
</html>
